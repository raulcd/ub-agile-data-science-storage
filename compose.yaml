services:
  storage:
    image: rustfs/rustfs:1.0.1
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: student
      RUSTFS_SECRET_KEY: student-secret
    volumes:
      - s3data:/data

  web:
    build: ./app
    ports:
      - "5001:5000"
    environment:
      S3_ENDPOINT: http://storage:9000
      AWS_ACCESS_KEY_ID: student
      AWS_SECRET_ACCESS_KEY: student-secret
      AWS_REGION: us-east-1
    depends_on:
      - storage

volumes:
  s3data: